<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FlagBattle</title>
<style>
html,body{margin:0;height:100%;background:#070a1c;overflow:hidden;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script>
/* FLAGBATTLE PART 1 - Argentina vs Brazil. Two glossy 3D-style flag marbles, one race, one winner.
   Vertical 9:16 for YouTube Shorts. Flags load from flagcdn.com (needs internet). All audio is synthesized.
   Tap once to start (browsers block sound until a tap). Tap after the winner popup to race again. */
const cv=document.getElementById('c'),g=cv.getContext('2d');

/* ============================================================
   ===============  EDIT THIS BLOCK FOR EACH NEW VIDEO  ========
   ============================================================
   PART_NUMBER : the Shorts episode number, shown as "FlagBattle Part X"

   COUNTRY_A / B : each side needs a NAME, plus EITHER:
     - code : a 2-letter ISO country code, to auto-fetch a national flag
               from flagcdn.com. Find codes at https://flagcdn.com/en/codes.json
               Examples: ar=Argentina, br=Brazil, fr=France, de=Germany,
               jp=Japan, kr=South Korea, mx=Mexico, us=USA, it=Italy
     - img  : a direct https image URL to use instead - this is how you
               use a CLUB crest (Barcelona, Real Madrid, Inter Miami, etc)
               or any custom logo. Club badges are trademarked, so host
               your own copy of the image (e.g. upload it to Imgur/your
               own site/Google Drive "anyone with the link") and paste
               that direct image link here. If both code and img are
               given, img wins.
   ============================================================ */

   
const PART_NUMBER = 3;
const COUNTRY_A = { code: 'es', name: 'SPAIN', img: '' };
const COUNTRY_B = { code: 'pt', name: 'PORTUGAL', img: '' }; 

/*
 Club-flag example (once you have your own hosted image links):
 const COUNTRY_A = { name: 'BARCELONA', img: 'https://cdn.phototourl.com/free/2026-09-22-0628430b-865f-470a-985d-e2b27b08972f.png' };
const COUNTRY_B = { name: 'REAL MADRID', img: 'https://yourhost.com/real-madrid-crest.png' };

/* ============================================================ */

const W=720,H=1280,VX=30,VY=215,TW=660,VH=1000,L=6900,R=38,F='"Arial Black","Segoe UI",system-ui,sans-serif';
let K=1;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*s*d;cv.height=H*s*d;K=cv.width/W}
addEventListener('resize',fit);fit();
const TEAMS=[{code:COUNTRY_A.code,name:COUNTRY_A.name.toUpperCase(),glow:'#8fd0ff',c:'#74acdf'},{code:COUNTRY_B.code,name:COUNTRY_B.name.toUpperCase(),glow:'#ffe45c',c:'#00b34a'}];
TEAMS.forEach((t,i)=>{const cfg=[COUNTRY_A,COUNTRY_B][i];t.img=new Image();t.img.src=cfg.img?cfg.img:'https://flagcdn.com/w320/'+t.code+'.png'});
document.title='FlagBattle Part '+PART_NUMBER+' - '+COUNTRY_A.name+' vs '+COUNTRY_B.name;

/* ---------- audio ---------- */
let AC,master,mg,muted=false,nt=0,stp=0,lastPl=0,lastCl=0;
const STEP=60/126/4,CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]],RT=[110,87.3,130.8,98],PENT=[523,587,659,784,880,1047];
const now=()=>AC.currentTime;
function initAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
 mg=AC.createGain();mg.gain.value=.22;mg.connect(master);nt=AC.currentTime+.1;setInterval(music,50)}
function tone(f,t,d,type,v,dest,to){const o=AC.createOscillator(),n=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
 n.gain.setValueAtTime(0,t);n.gain.linearRampToValueAtTime(v,t+.01);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(dest||master);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,hp,dest){const c=AC.sampleRate*d|0,b=AC.createBuffer(1,c,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<c;i++)a[i]=Math.random()*2-1;
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),n=AC.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(n);n.connect(dest||master);s.start(t)}
function music(){while(nt<AC.currentTime+.25){const s=stp,t=nt,bar=(s>>4)&3,k=s&15,ch=CH[bar];
 if(k%4===0)tone(150,t,.18,'sine',.9,mg,45);
 if(k%4===2)noise(t,.05,.25,7000,mg);
 if(k%2===0)tone(RT[bar],t,STEP*1.7,'sawtooth',.26,mg);
 tone(ch[[0,1,2,1][k%4]]*(k>7?2:1),t,STEP*.9,'triangle',.22,mg);nt+=STEP;stp++}}
const beep=n=>tone([587,659,784][n],now(),.22,'square',.16);
function goSfx(){const t=now();tone(523,t,.5,'sawtooth',.14,0,1046);tone(1046,t+.05,.6,'square',.14);noise(t,.4,.3,1500)}
const plink=()=>tone(PENT[Math.random()*6|0]*(Math.random()<.4?2:1),now(),.25,'sine',.06);
function clonk(){const t=now();tone(160,t,.22,'sine',.5,0,55);noise(t,.08,.25,1200)}
function bell(f,t){tone(f,t,1.7,'sine',.22);tone(f*2,t,1.1,'triangle',.08);tone(f*3.01,t,.5,'sine',.04)}
function subDing(){const t=now();tone(660,t,.16,'square',.2);tone(880,t+.13,.22,'square',.22);tone(1320,t+.28,.35,'triangle',.2,0,1320)}
function fanfare(){const t=now()+.05;mg.gain.setTargetAtTime(.05,now(),.15);
 [523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,t+i*.14));
 [1046.5,1318.5,1568].forEach(f=>bell(f,t+.64));[523.25,659.25,783.99].forEach(f=>tone(f,t+.64,1.8,'sawtooth',.05));
 for(let i=0;i<10;i++)tone(2200+Math.random()*2200,t+.7+i*.09,.18,'sine',.035)}

/* ---------- course ---------- */
const pegs=[],segs=[],rots=[];
const zone=(a,b)=>{for(let y=a,r=0;y<=b;y+=130,r++){const odd=r%2;for(let x=odd?170:90;x<TW;x+=160)pegs.push({x,y})}};
zone(500,2050);zone(4200,5700);
for(const y of[2200,3950,5850])segs.push({ax:0,ay:y,bx:240,by:y+110},{ax:TW,ay:y,bx:TW-240,by:y+110});
for(const y of[2500,2820,3140,3460,3780,6150,6470])rots.push({cx:165,cy:y,len:210,a:Math.random()*6,w:1.2+Math.random()*.6},{cx:495,cy:y,len:210,a:Math.random()*6,w:-(1.2+Math.random()*.6)});
const bokeh=Array.from({length:14},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:40+Math.random()*90,c:i%2?'#74acdf':'#ffe45c',p:Math.random()*6}));

/* ---------- state ---------- */
let M=[],st='start',cd=0,lastCd=-1,cam=0,T=0,acc=0,winner=null,winT=0,fan=false,parts=[],subShown=false,subT=0;
function reset(){M=TEAMS.map((t,i)=>({t,x:i?460:200,y:60,vx:(Math.random()-.5)*120,vy:0,roll:0,fin:false,idle:0,tr:[]}));cam=0;T=0;winner=null;winT=0;fan=false;parts=[];subShown=false;subT=0;if(AC)mg.gain.setTargetAtTime(.22,now(),.3)}
reset();
function spark(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.3,s=120+Math.random()*320;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,c,s:4+Math.random()*4,gr:500,w:1})}}

function hit(m,ax,ay,bx,by,w,cx,cy,th){
 const dx=bx-ax,dy=by-ay,dd=dx*dx+dy*dy;let t=dd?((m.x-ax)*dx+(m.y-ay)*dy)/dd:0;t=Math.max(0,Math.min(1,t));
 const px=ax+dx*t,py=ay+dy*t;let nx=m.x-px,ny=m.y-py,d=Math.hypot(nx,ny);const rr=R+th;
 if(d>=rr)return false;if(d<1e-6){nx=0;ny=-1;d=1}nx/=d;ny/=d;m.x=px+nx*rr;m.y=py+ny*rr;
 const vn=(m.vx+w*(py-cy))*nx+(m.vy-w*(px-cx))*ny;if(vn<0){m.vx-=1.55*vn*nx;m.vy-=1.55*vn*ny}
 if(th===12)m.vx+=(Math.random()-.5)*40;return true}

function step(dt){
 T+=dt;for(const r of rots)r.a+=r.w*dt;const ly=Math.max(M[0].y,M[1].y);
 for(const m of M){if(m.fin)continue;
  const gf=1+.18*Math.min(1,Math.max(0,(ly-m.y)/700))+Math.max(0,(T-55)/40);
  m.vy+=800*gf*dt;m.x+=m.vx*dt;m.y+=m.vy*dt;m.roll+=m.vx*dt/R*.6;
  const sp=Math.hypot(m.vx,m.vy);if(sp>800){m.vx*=800/sp;m.vy*=800/sp}
  if(m.x<R){m.x=R;m.vx=Math.abs(m.vx)*.5}if(m.x>TW-R){m.x=TW-R;m.vx=-Math.abs(m.vx)*.5}
  if(m.y<R){m.y=R;m.vy=Math.abs(m.vy)*.3}
  for(const p of pegs)if(Math.abs(p.y-m.y)<R+16&&hit(m,p.x,p.y,p.x,p.y,0,0,0,12)&&AC&&performance.now()-lastPl>90){lastPl=performance.now();plink()}
  for(const s of segs)hit(m,s.ax,s.ay,s.bx,s.by,0,0,0,5);
  for(const r of rots)if(Math.abs(r.cy-m.y)<170){const c=Math.cos(r.a)*r.len/2,s=Math.sin(r.a)*r.len/2;hit(m,r.cx-c,r.cy-s,r.cx+c,r.cy+s,r.w,r.cx,r.cy,9)}
  m.idle=sp<30?m.idle+dt:0;if(m.idle>1.2){m.vx+=(Math.random()-.5)*500;m.vy-=250;m.idle=0}
  if(m.y>L){m.fin=true;if(!winner){winner=m;st='win';winT=0}}}
 const [p,q]=M;if(!p.fin&&!q.fin){let dx=q.x-p.x,dy=q.y-p.y;const d=Math.hypot(dx,dy);
  if(d<2*R&&d>0){dx/=d;dy/=d;const o=(2*R-d)/2;p.x-=dx*o;p.y-=dy*o;q.x+=dx*o;q.y+=dy*o;
   const vn=(q.vx-p.vx)*dx+(q.vy-p.vy)*dy;if(vn<0){const k=-.9*vn;p.vx-=k*dx;p.vy-=k*dy;q.vx+=k*dx;q.vy+=k*dy;
    if(-vn>120&&performance.now()-lastCl>150){lastCl=performance.now();if(AC)clonk();spark((p.x+q.x)/2,(p.y+q.y)/2,'#fff',14)}}}}}

function update(dt){
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.gr||60)*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);
 if(st==='count'){cd+=dt;const n=Math.floor(cd);if(n!==lastCd){lastCd=n;if(AC){if(n<3)beep(n);else goSfx()}}if(cd>=3.7)st='race'}
 if(st==='race'||st==='win'){acc+=dt;while(acc>=1/240){step(1/240);acc-=1/240}
  for(const m of M)if(!m.fin){m.tr.push({x:m.x,y:m.y});if(m.tr.length>16)m.tr.shift()}
  const a=M[0],b=M[1],ly=Math.max(a.y,b.y),ty=Math.min(a.y,b.y),mid=(ly+ty)/2;
  const tgt=Math.min(Math.max(Math.min(mid-VH*.5,ty-80),ly-VH+140),L+120-VH);cam+=(Math.max(0,tgt)-cam)*.09
  if(st==='race'&&!subShown&&T>=10){subShown=true;subT=0;st='sub';if(AC)subDing()}}
 if(st==='sub'){subT+=dt;if(subT>4)st='race'}
 if(st==='win'){winT+=dt;if(winT>.8&&!fan){fan=true;if(AC)fanfare();
  for(let i=0;i<160;i++)parts.push({x:Math.random()*W,y:-Math.random()*500,vx:(Math.random()-.5)*160,vy:120+Math.random()*260,life:6,c:`hsl(${Math.random()*360},90%,62%)`,s:6+Math.random()*7,gr:60})}}}

/* ---------- drawing ---------- */
function t3(s,x,y,sz,fill,dep,al,d){d=d||6;g.font=`900 ${sz}px ${F}`;g.textAlign=al||'center';g.textBaseline='alphabetic';g.lineJoin='round';
 for(let i=d;i>0;i--){g.fillStyle=dep;g.fillText(s,x+i*.6,y+i*1.1)}
 g.lineWidth=sz/9;g.strokeStyle='rgba(8,10,40,.85)';g.strokeText(s,x,y);g.fillStyle=fill;g.fillText(s,x,y)}
function sphere(t,x,y,r,roll,alpha,shadow){
 g.save();g.globalAlpha=alpha;
 if(shadow){g.save();g.translate(x+r*.45,y+r*.75);g.scale(1,.6);const sg=g.createRadialGradient(0,0,0,0,0,r*1.15);sg.addColorStop(0,'rgba(0,0,0,.5)');sg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=sg;g.beginPath();g.arc(0,0,r*1.15,0,7);g.fill();g.restore()}
 g.translate(x,y);g.save();g.beginPath();g.arc(0,0,r,0,7);g.clip();
 const im=t.img;
 if(im.complete&&im.naturalWidth){const iw=im.naturalWidth,ih=im.naturalHeight,sh=Math.sin(roll)*iw*.2;
  for(let dx=-r;dx<r;dx+=2){const th=Math.asin(Math.max(-1,Math.min(1,(dx+1)/r))),sw=Math.max(1,ih/(r*Math.max(.15,Math.cos(th))));
   const sx=Math.max(0,Math.min(iw-sw,iw/2+th*ih/2+sh-sw/2));g.drawImage(im,sx,0,sw,ih,dx,-r,2.6,2*r)}}
 else{g.fillStyle=t.c;g.fillRect(-r,-r,2*r,2*r)}
 g.restore();
 let gr=g.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r*1.05);gr.addColorStop(0,'rgba(255,255,255,.3)');gr.addColorStop(.35,'rgba(255,255,255,0)');gr.addColorStop(.75,'rgba(0,0,20,.18)');gr.addColorStop(1,'rgba(0,0,30,.62)');
 g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();
 gr=g.createRadialGradient(r*.5,r*.55,r*.05,r*.5,r*.55,r*.7);gr.addColorStop(0,'rgba(255,240,180,.3)');gr.addColorStop(1,'rgba(255,240,180,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();
 gr=g.createRadialGradient(-r*.38,-r*.45,0,-r*.38,-r*.45,r*.32);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(-r*.38,-r*.45,r*.32,0,7);g.fill();
 g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.3)';g.beginPath();g.arc(0,0,r-1,0,7);g.stroke();g.restore()}
function beam(ax,ay,bx,by,w,top,side,hl){
 g.lineCap='round';const l=(dx,dy,c,lw,al)=>{g.globalAlpha=al||1;g.strokeStyle=c;g.lineWidth=lw;g.beginPath();g.moveTo(ax+dx,ay+dy);g.lineTo(bx+dx,by+dy);g.stroke()};
 l(10,16,'rgba(0,0,0,.4)',w);l(0,7,side,w);l(0,0,top,w);l(-2,-3,hl,w*.28,.7);g.globalAlpha=1}
function orb(x,y,r,c1,c2){const gr=g.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}

function draw(){
 g.setTransform(K,0,0,K,0,0);const tm=performance.now()/1000;
 const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a1245');bg.addColorStop(.5,'#2a1170');bg.addColorStop(1,'#0b3a4a');g.fillStyle=bg;g.fillRect(0,0,W,H);
 for(const b of bokeh){const y=b.y+Math.sin(tm*.4+b.p)*14,r=g.createRadialGradient(b.x,y,0,b.x,y,b.r);r.addColorStop(0,b.c+'40');r.addColorStop(1,b.c+'00');g.fillStyle=r;g.fillRect(b.x-b.r,y-b.r,b.r*2,b.r*2)}
 const tg=g.createLinearGradient(0,50,0,100);tg.addColorStop(0,'#fff6b0');tg.addColorStop(1,'#ffc21a');
 t3('FlagBattle Part '+PART_NUMBER,W/2,96,60,tg,'#a35a00',null,8);
 g.font=`900 36px ${F}`;const hw=g.measureText(COUNTRY_A.name+' vs '+COUNTRY_B.name).width/2;
 t3(COUNTRY_A.name+' vs '+COUNTRY_B.name,W/2,160,36,'#fff','#1b3f8f',null,5);
 sphere(TEAMS[0],W/2-hw-34,148,22,0,1,false);sphere(TEAMS[1],W/2+hw+34,148,22,0,1,false);

 // viewport frame (3D slab)
 g.fillStyle='#0a0630';g.beginPath();g.roundRect(VX,VY+12,TW,VH,30);g.fill();
 g.save();g.beginPath();g.roundRect(VX,VY,TW,VH,30);g.clip();
 const fl=g.createLinearGradient(0,VY,0,VY+VH);fl.addColorStop(0,'#1d1a5c');fl.addColorStop(1,'#33176a');g.fillStyle=fl;g.fillRect(VX,VY,TW,VH);
 g.save();g.translate(VX,VY-cam);
 for(let y=Math.floor(cam/120)*120;y<cam+VH+120;y+=120){if((y/120)%2){g.fillStyle='rgba(255,255,255,.035)';g.fillRect(0,y,TW,120)}}
 for(const p of pegs){if(p.y<cam-30||p.y>cam+VH+30)continue;g.fillStyle='rgba(0,0,0,.38)';g.beginPath();g.ellipse(p.x+9,p.y+13,13,9,0,0,7);g.fill();orb(p.x,p.y,12,'#e2e8ff','#2a3690')}
 for(const s of segs)beam(s.ax,s.ay,s.bx,s.by,20,'#ff5ea8','#8a1f57','#ffd0e6');
 for(const r of rots){if(r.cy<cam-170||r.cy>cam+VH+170)continue;const c=Math.cos(r.a)*r.len/2,s=Math.sin(r.a)*r.len/2;
  beam(r.cx-c,r.cy-s,r.cx+c,r.cy+s,20,'#ffd23f','#a86d00','#fff6c0');orb(r.cx,r.cy,11,'#fff','#8a6a20')}
 for(let i=0;i<22;i++){g.fillStyle=i%2?'#fff':'#141414';g.fillRect(i*30,L,30,18);g.fillStyle=i%2?'#141414':'#fff';g.fillRect(i*30,L+18,30,18)}
 for(const m of M){for(let i=0;i<m.tr.length;i++){const p=m.tr[i],f=i/m.tr.length;g.globalAlpha=f*.35;g.fillStyle=m.t.glow;g.beginPath();g.arc(p.x,p.y,R*f*.8,0,7);g.fill()}g.globalAlpha=1}
 for(const m of M)if(!m.fin&&m.y>cam-90&&m.y<cam+VH+90)sphere(m.t,m.x,m.y,R,m.roll,1,true);
 for(const p of parts)if(p.w){g.globalAlpha=Math.max(0,p.life*1.6);g.fillStyle=p.c;g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}g.globalAlpha=1;
 // 3D side walls
 let wg=g.createLinearGradient(0,0,16,0);wg.addColorStop(0,'#ffe45c');wg.addColorStop(1,'rgba(255,228,92,0)');g.fillStyle=wg;g.fillRect(0,cam,16,VH);
 wg=g.createLinearGradient(TW,0,TW-16,0);wg.addColorStop(0,'#74acdf');wg.addColorStop(1,'rgba(116,172,223,0)');g.fillStyle=wg;g.fillRect(TW-16,cam,16,VH);
 g.restore();
 const vg=g.createLinearGradient(0,VY,0,VY+VH);vg.addColorStop(0,'rgba(5,3,30,.45)');vg.addColorStop(.15,'rgba(5,3,30,0)');vg.addColorStop(.85,'rgba(5,3,30,0)');vg.addColorStop(1,'rgba(5,3,30,.45)');g.fillStyle=vg;g.fillRect(VX,VY,TW,VH);
 if(st==='count'){const n=Math.floor(cd),f=cd%1,e=1+.4*(1-f);g.globalAlpha=n<3?1:Math.max(0,1-(cd-3)/.7);
  t3(n<3?String(3-n):'GO!',VX+TW/2,VY+VH/2+(n<3?90:55),(n<3?300:190)*e,n<3?'#ffe45c':'#fff','#a35a00',null,10);g.globalAlpha=1}
 g.restore();
 g.save();g.strokeStyle='#ffd23f';g.lineWidth=6;g.shadowColor='#fff';g.shadowBlur=18;g.beginPath();g.roundRect(VX,VY,TW,VH,30);g.stroke();g.restore();
 t3(muted?'\u{1F507}':'\u{1F50A}',W-40,66,32,'#fff','#000',null,1);
 if(st==='start'){g.fillStyle='rgba(5,8,25,.72)';g.fillRect(0,0,W,H);
  sphere(TEAMS[0],220,560,90,0,1,true);sphere(TEAMS[1],500,560,90,0,1,true);t3('VS',W/2,588,46,'#fff','#1b3f8f');
  t3('TAP TO START',W/2,820+Math.sin(tm*3.3)*8,66,'#ffe45c','#a35a00',null,8);t3('sound on',W/2,880,28,'#b9d6ff','#0a0630',null,2)}
 if(st==='win'&&fan){g.fillStyle='rgba(5,8,25,.72)';g.fillRect(0,0,W,H);
  const p=Math.min(1,(winT-.8)*2.2),s=Math.max(.01,1+2.70158*Math.pow(p-1,3)+1.70158*Math.pow(p-1,2)),t=winner.t;
